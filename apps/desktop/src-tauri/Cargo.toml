[package]
name = "shadowshield-desktop"
version = "0.1.0"
description = "ShadowShield V2 Desktop Tray & Status UI"
authors = ["ShadowShield Desktop Team"]
edition = "2021"

[workspace]

[lib]
name = "shadowshield_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
